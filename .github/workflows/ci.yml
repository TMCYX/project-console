name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  fresh-clone-smoke:
    name: fresh clone → app boots
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci
      - name: Smoke test (module load · data layer · electron boot)
        run: npm run smoke
